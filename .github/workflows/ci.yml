name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    strategy:
      matrix:
        # The oldest version is module.hugoVersion.min in hugo.toml; tests/run.sh fails when they differ.
        hugo: ["0.158.0", "0.169.0"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: hugo-theme-bestiary
      - name: Install Hugo
        run: |
          curl -fsSL "https://github.com/gohugoio/hugo/releases/download/v${{ matrix.hugo }}/hugo_${{ matrix.hugo }}_linux-amd64.tar.gz" | tar -xz -C "$RUNNER_TEMP" hugo
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - run: sh hugo-theme-bestiary/tests/run.sh

  visual:
    # The image the references in tests/visual/screenshots were made in; scripts/visual.sh runs the same one.
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    env:
      HOME: /root
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: hugo-theme-bestiary
      - name: Install Hugo
        run: |
          curl -fsSL "https://github.com/gohugoio/hugo/releases/download/v0.169.0/hugo_0.169.0_linux-amd64.tar.gz" | tar -xz -C /usr/local/bin hugo
      - run: npm ci --no-audit --no-fund
        working-directory: hugo-theme-bestiary
      - run: npx playwright test
        working-directory: hugo-theme-bestiary
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            hugo-theme-bestiary/playwright-report
            hugo-theme-bestiary/test-results
