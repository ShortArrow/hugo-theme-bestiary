{{ define "main" }}
<article>
  {{- with .Parent }}{{ if not .IsHome }}
  <a class="bestiary-running-head" href="{{ .RelPermalink }}">{{ .Title }}</a>
  {{- end }}{{ end }}
  <h1>{{ .Title }}</h1>
  {{ partial "bestiary/plate.html" . }}
  {{ partial "bestiary/card.html" . }}
  {{ .Content }}
</article>
{{ end }}
